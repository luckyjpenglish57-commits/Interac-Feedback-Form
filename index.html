<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interac Lesson Feedback Portal</title>
    <style>
        :root {
            --primary: #1d4ed8;
            --primary-hover: #1e40af;
            --bg: #f1f5f9;
            --card-bg: #ffffff;
            --text: #0f172a;
            --border: #cbd5e1;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: var(--bg); color: var(--text); display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        .container { width: 100%; max-width: 650px; background: var(--card-bg); border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.08); border: 1px solid var(--border); overflow: hidden; }
        
        .header { background: var(--primary); color: white; padding: 28px 20px; text-align: center; }
        .header h1 { font-size: 1.6rem; font-weight: 700; margin-bottom: 6px; }
        .header p { font-size: 0.9rem; opacity: 0.92; font-weight: 400; }
        
        .form-body { padding: 28px 24px; }
        .form-group { margin-bottom: 20px; }
        label { display: block; font-size: 0.88rem; font-weight: 600; margin-bottom: 8px; color: #334155; }
        input, select, textarea { width: 100%; padding: 12px; border: 1px solid var(--border); border-radius: 8px; font-size: 0.95rem; outline: none; background-color: #fff; }
        input:focus, select:focus, textarea:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(29, 78, 216, 0.15); }
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
        
        .step { display: none; }
        .step.active { display: block; }

        .btn-group { display: flex; gap: 10px; margin-top: 24px; }
        .btn { flex: 1; padding: 14px; border: none; border-radius: 8px; font-weight: 600; cursor: pointer; font-size: 1rem; }
        .btn-primary { background: var(--primary); color: white; }
        .btn-primary:hover { background: var(--primary-hover); }
        .btn-secondary { background: #e2e8f0; color: var(--text); }
        
        .success-message { display: none; text-align: center; padding: 40px 20px; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>Interac Lesson Feedback Portal</h1>
        <p id="stepIndicator">Please make sure to submit your feedback correctly and on time.</p>
    </div>

    <div class="form-body" id="formContainer">
        <form id="feedbackForm">
            
            <div class="step active" id="step1">
                <div class="form-group">
                    <label>Email Address *</label>
                    <input type="email" id="email" required placeholder="your.email@interac.co.jp">
                </div>
                <div class="grid-2">
                    <div class="form-group">
                        <label>Teacher Name *</label>
                        <input type="text" id="teacherName" required placeholder="Full Name">
                    </div>
                    <div class="form-group">
                        <label>Date *</label>
                        <input type="date" id="date" required>
                    </div>
                </div>
                <div class="form-group">
                    <label>Area (BOE) *</label>
                    <select id="areaSelect" required onchange="updateSchools()">
                        <option value="" disabled selected>-- Select Area (BOE) --</option>
                        <option value="Kanzaki City">Kanzaki City</option>
                    </select>
                </div>
                <div class="btn-group">
                    <button type="button" class="btn btn-primary" onclick="nextStep()">Next Section ➔</button>
                </div>
            </div>

            <div class="step" id="step2">
                <div class="form-group">
                    <label>School *</label>
                    <select id="schoolSelect" required>
                        <option value="" disabled selected>-- Select Area first --</option>
                    </select>
                </div>
                
                <div class="grid-2">
                    <div class="form-group">
                        <label>Group Name *</label>
                        <select id="groupName" required>
                            <option value="" disabled selected>-- Select Group --</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Number of Students *</label>
                        <input type="number" id="numStudents" required placeholder="e.g. 25">
                    </div>
                </div>

                <div class="grid-2">
                    <div class="form-group">
                        <label>Listening Skills *</label>
                        <select id="listening" required>
                            <option value="" disabled selected>-- Select --</option>
                            <option value="3 - Excellent">3 - Excellent</option>
                            <option value="2 - Good">2 - Good</option>
                            <option value="1 - Poor">1 - Poor</option>
                            <option value="0 - The student did not show up">0 - The student did not show up</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Speaking Skills *</label>
                        <select id="speaking" required>
                            <option value="" disabled selected>-- Select --</option>
                            <option value="3 - Excellent">3 - Excellent</option>
                            <option value="2 - Good">2 - Good</option>
                            <option value="1 - Poor">1 - Poor</option>
                            <option value="0 - The student did not show up">0 - The student did not show up</option>
                        </select>
                    </div>
                </div>

                <div class="grid-2">
                    <div class="form-group">
                        <label>Proactiveness *</label>
                        <select id="proactiveness" required>
                            <option value="" disabled selected>-- Select --</option>
                            <option value="3 - Excellent">3 - Excellent</option>
                            <option value="2 - Good">2 - Good</option>
                            <option value="1 - Poor">1 - Poor</option>
                            <option value="0 - The student did not show up">0 - The student did not show up</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Attitude *</label>
                        <select id="attitude" required>
                            <option value="" disabled selected>-- Select --</option>
                            <option value="3 - Excellent">3 - Excellent</option>
                            <option value="2 - Good">2 - Good</option>
                            <option value="1 - Poor">1 - Poor</option>
                            <option value="0 - The student did not show up">0 - The student did not show up</option>
                        </select>
                    </div>
                </div>

                <div class="form-group">
                    <label>Message of encouragement or feedback for your student(s)</label>
                    <textarea id="messageEncouragement" rows="3" placeholder="*If your student did not show up, please leave them a positive comment about English."></textarea>
                </div>

                <div class="form-group">
                    <label>Any comments or feedback for Interac about this lesson</label>
                    <textarea id="interacFeedback" rows="2" placeholder="Your comments for Interac..."></textarea>
                </div>

                <div class="btn-group">
                    <button type="button" class="btn btn-secondary" onclick="prevStep()">← Back</button>
                    <button type="submit" class="btn btn-primary">Submit Feedback</button>
                </div>
            </div>

        </form>
    </div>

    <div class="success-message" id="successMessage">
        <h2>✓ Thank You!</h2>
        <p>Your lesson feedback has been successfully submitted.</p>
        <br>
        <button class="btn btn-secondary" onclick="location.reload()">Submit Another Response</button>
    </div>
</div>

<script>
    // SCHOOLS PER AREA DATA
    const schoolData = {
        "Kanzaki City": ["Saigo ES", "Saigo JHS", "Tobu ES", "Chubu ES", "Niiyama ES", "Kanzaki ES", "Sefuri ES", "Seibu ES"]
    };

    // AUTOMATIC GENERATION OF GROUP NAMES (Kanzaki 1_A to Kanzaki 40_A, 41_B to 80_B)
    window.onload = function() {
        const groupSelect = document.getElementById("groupName");
        for (let i = 1; i <= 80; i++) {
            const suffix = i <= 40 ? "A" : "B";
            const groupText = `Kanzaki ${i}_${suffix}`;
            const opt = document.createElement("option");
            opt.value = groupText;
            opt.textContent = groupText;
            groupSelect.appendChild(opt);
        }
    };

    function updateSchools() {
        const area = document.getElementById("areaSelect").value;
        const schoolDropdown = document.getElementById("schoolSelect");
        schoolDropdown.innerHTML = '<option value="" disabled selected>-- Select School --</option>';
        
        if (schoolData[area]) {
            schoolData[area].forEach(school => {
                const opt = document.createElement("option");
                opt.value = school;
                opt.textContent = school;
                schoolDropdown.appendChild(opt);
            });
        }
    }

    function nextStep() {
        const email = document.getElementById("email").value;
        const teacher = document.getElementById("teacherName").value;
        const date = document.getElementById("date").value;
        const area = document.getElementById("areaSelect").value;

        if(!email || !teacher || !date || !area) {
            alert("Please fill in all required fields in Section 1.");
            return;
        }

        document.getElementById("step1").classList.remove("active");
        document.getElementById("step2").classList.add("active");
        document.getElementById("stepIndicator").textContent = "Section 2: School & Lesson Details";
    }

    function prevStep() {
        document.getElementById("step2").classList.remove("active");
        document.getElementById("step1").classList.add("active");
        document.getElementById("stepIndicator").textContent = "Please make sure to submit your feedback correctly and on time.";
    }

    // PASTE YOUR GOOGLE APPS SCRIPT WEB APP URL HERE:
    const SCRIPT_URL = function doPost(e) {
  try {
    var sheet = SpreadsheetApp.getActiveSpreadsheet().getActiveSheet();
    var data = JSON.parse(e.postData.contents);
    
    sheet.appendRow([
      new Date(),                 // Timestamp
      data.email,                 // Email Address
      data.teacherName,           // Teacher Name
      data.date,                  // Date
      data.area,                  // Area (BOE)
      data.school,                // School
      data.groupName,             // Group Name
      data.numStudents,           // Number of Students
      data.listening,             // Listening skills
      data.speaking,              // Speaking skills
      data.proactiveness,         // Proactiveness
      data.attitude,              // Attitude
      data.messageEncouragement,  // Message of encouragement
      data.interacFeedback        // Comments/feedback for Interac
    ]);
    
    return ContentService.createTextOutput(JSON.stringify({ "result": "success" }))
      .setMimeType(ContentService.MimeType.JSON);
  } catch (error) {
    return ContentService.createTextOutput(JSON.stringify({ "result": "error", "error": error.toString() }))
      .setMimeType(ContentService.MimeType.JSON);
  }
}

    document.getElementById('feedbackForm').addEventListener('submit', function(e) {
        e.preventDefault();

        const payload = {
            email: document.getElementById('email').value,
            teacherName: document.getElementById('teacherName').value,
            date: document.getElementById('date').value,
            area: document.getElementById('areaSelect').value,
            school: document.getElementById('schoolSelect').value,
            groupName: document.getElementById('groupName').value,
            numStudents: document.getElementById('numStudents').value,
            listening: document.getElementById('listening').value,
            speaking: document.getElementById('speaking').value,
            proactiveness: document.getElementById('proactiveness').value,
            attitude: document.getElementById('attitude').value,
            messageEncouragement: document.getElementById('messageEncouragement').value,
            interacFeedback: document.getElementById('interacFeedback').value
        };

        fetch(SCRIPT_URL, {
            method: 'POST',
            mode: 'no-cors',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
        }).then(() => {
            document.getElementById('formContainer').style.display = 'none';
            document.getElementById('successMessage').style.display = 'block';
        }).catch(err => alert("Error submitting form: " + err));
    });
</script>
</body>
</html>
