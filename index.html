<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interac Lesson Feedback Portal</title>
    <style>
        :root {
            --primary: #1e40af;
            --primary-hover: #1e3a8a;
            --bg: #f8fafc;
            --card-bg: #ffffff;
            --text: #0f172a;
            --border: #cbd5e1;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: var(--bg); color: var(--text); display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        .container { width: 100%; max-width: 680px; background: var(--card-bg); border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.08); border: 1px solid var(--border); overflow: hidden; }
        .header { background: var(--primary); color: white; padding: 24px; text-align: center; }
        .header h1 { font-size: 1.5rem; margin-bottom: 6px; }
        .form-body { padding: 28px 24px; }
        .form-group { margin-bottom: 18px; }
        label { display: block; font-size: 0.88rem; font-weight: 600; margin-bottom: 6px; color: #334155; }
        input, select, textarea { width: 100%; padding: 10px 12px; border: 1px solid var(--border); border-radius: 6px; font-size: 0.95rem; outline: none; }
        input:focus, select:focus, textarea:focus { border-color: var(--primary); box-shadow: 0 0 0 3px rgba(30, 64, 175, 0.15); }
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        
        .step { display: none; }
        .step.active { display: block; }

        .btn-group { display: flex; gap: 10px; margin-top: 24px; }
        .btn { flex: 1; padding: 12px; border: none; border-radius: 6px; font-weight: 600; cursor: pointer; font-size: 0.95rem; }
        .btn-primary { background: var(--primary); color: white; }
        .btn-primary:hover { background: var(--primary-hover); }
        .btn-secondary { background: #e2e8f0; color: var(--text); }
        
        .success-message { display: none; text-align: center; padding: 40px 20px; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>Lesson Feedback Portal</h1>
        <p id="stepIndicator">Section 1: General Details</p>
    </div>

    <div class="form-body" id="formContainer">
        <form id="feedbackForm">
            
            <!-- SECTION 1: General Info -->
            <div class="step active" id="step1">
                <div class="form-group">
                    <label>Email Address *</label>
                    <input type="email" id="email" required placeholder="your.email@interac.co.jp">
                </div>
                <div class="grid-2">
                    <div class="form-group">
                        <label>Teacher Name *</label>
                        <input type="text" id="teacherName" required placeholder="Full Name">
                    </div>
                    <div class="form-group">
                        <label>Date *</label>
                        <input type="date" id="date" required>
                    </div>
                </div>
                <div class="form-group">
                    <label>Area (BOE) *</label>
                    <select id="areaSelect" required onchange="updateSchools()">
                        <option value="" disabled selected>-- Select Area (BOE) --</option>
                        <option value="Area 1">Area 1 (North BOE)</option>
                        <option value="Area 2">Area 2 (South BOE)</option>
                        <option value="Area 3">Area 3 (Central BOE)</option>
                    </select>
                </div>
                <div class="btn-group">
                    <button type="button" class="btn btn-primary" onclick="nextStep()">Next Section ➔</button>
                </div>
            </div>

            <!-- SECTION 2: School & Lesson Details -->
            <div class="step" id="step2">
                <div class="form-group">
                    <label>School *</label>
                    <select id="schoolSelect" required>
                        <option value="" disabled selected>-- Select Area first --</option>
                    </select>
                </div>
                
                <div class="grid-2">
                    <div class="form-group">
                        <label>Group Name</label>
                        <input type="text" id="groupName" placeholder="e.g. Group A">
                    </div>
                    <div class="form-group">
                        <label>Grade *</label>
                        <input type="text" id="grade" required placeholder="e.g. Grade 5 / ES 5">
                    </div>
                </div>

                <div class="grid-2">
                    <div class="form-group">
                        <label>Class *</label>
                        <input type="text" id="classNum" required placeholder="e.g. Class 1">
                    </div>
                    <div class="form-group">
                        <label>Number of Students *</label>
                        <input type="number" id="numStudents" required placeholder="e.g. 25">
                    </div>
                </div>

                <div class="grid-2">
                    <div class="form-group">
                        <label>Ability of student(s) *</label>
                        <select id="studentAbility" required>
                            <option value="" disabled selected>-- Select --</option>
                            <option value="High">High</option>
                            <option value="Average">Average</option>
                            <option value="Low">Low</option>
                            <option value="Mixed">Mixed</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Level of student interest *</label>
                        <select id="studentInterest" required>
                            <option value="" disabled selected>-- Select --</option>
                            <option value="High">High</option>
                            <option value="Moderate">Moderate</option>
                            <option value="Low">Low</option>
                        </select>
                    </div>
                </div>

                <div class="form-group">
                    <label>Message of encouragement or feedback for students</label>
                    <textarea id="messageEncouragement" rows="2" placeholder="If your student did not show up, please leave this blank or state here."></textarea>
                </div>

                <div class="form-group">
                    <label>Any comments or feedback for Interac about this lesson</label>
                    <textarea id="interacFeedback" rows="2" placeholder="Your comments for Interac..."></textarea>
                </div>

                <div class="btn-group">
                    <button type="button" class="btn btn-secondary" onclick="prevStep()">← Back</button>
                    <button type="submit" class="btn btn-primary">Submit Feedback</button>
                </div>
            </div>

        </form>
    </div>

    <div class="success-message" id="successMessage">
        <h2>✓ Thank You!</h2>
        <p>Your lesson feedback has been successfully submitted.</p>
        <br>
        <button class="btn btn-secondary" onclick="location.reload()">Submit Another Response</button>
    </div>
</div>

<script>
    // Sample List of Schools per Area (Palitan batay sa tunay ninyong mga eskwelahan)
    const schoolData = {
        "Area 1": ["North Elementary School", "North Junior High School"],
        "Area 2": ["South Elementary School", "South Junior High School"],
        "Area 3": ["Central Pilot School", "Central High School"]
    };

    function updateSchools() {
        const area = document.getElementById("areaSelect").value;
        const schoolDropdown = document.getElementById("schoolSelect");
        schoolDropdown.innerHTML = '<option value="" disabled selected>-- Select School --</option>';
        
        if (schoolData[area]) {
            schoolData[area].forEach(school => {
                const opt = document.createElement("option");
                opt.value = school;
                opt.textContent = school;
                schoolDropdown.appendChild(opt);
            });
        }
    }

    function nextStep() {
        const email = document.getElementById("email").value;
        const teacher = document.getElementById("teacherName").value;
        const date = document.getElementById("date").value;
        const area = document.getElementById("areaSelect").value;

        if(!email || !teacher || !date || !area) {
            alert("Please fill in all required fields in Section 1.");
            return;
        }

        document.getElementById("step1").classList.remove("active");
        document.getElementById("step2").classList.add("active");
        document.getElementById("stepIndicator").textContent = "Section 2: School & Lesson Details";
    }

    function prevStep() {
        document.getElementById("step2").classList.remove("active");
        document.getElementById("step1").classList.add("active");
        document.getElementById("stepIndicator").textContent = "Section 1: General Details";
    }

    // PASTE YOUR GOOGLE APPS SCRIPT WEB APP URL HERE:
    const SCRIPT_URL = function doPost(e) {
  try {
    var sheet = SpreadsheetApp.getActiveSpreadsheet().getActiveSheet();
    var data = JSON.parse(e.postData.contents);
    
    sheet.appendRow([
      new Date(),                 // Col A: Timestamp
      data.email,                 // Col B: Email Address
      data.teacherName,           // Col C: Teacher Name
      data.date,                  // Col D: Date
      data.area,                  // Col E: Area (BOE)
      data.school,                // Col F: School
      data.groupName,             // Col G: Group Name
      data.grade,                 // Col H: Grade
      data.classNum,              // Col I: Class
      data.numStudents,           // Col J: Number of Students
      data.studentAbility,        // Col K: Ability of student(s)
      data.studentInterest,       // Col L: Level of student interest
      data.messageEncouragement,  // Col M: Message of encouragement
      data.interacFeedback        // Col N: Comments or feedback for Interac
    ]);
    
    return ContentService.createTextOutput(JSON.stringify({ "result": "success" }))
      .setMimeType(ContentService.MimeType.JSON);
  } catch (error) {
    return ContentService.createTextOutput(JSON.stringify({ "result": "error", "error": error.toString() }))
      .setMimeType(ContentService.MimeType.JSON);
  }
}

    document.getElementById('feedbackForm').addEventListener('submit', function(e) {
        e.preventDefault();

        const payload = {
            email: document.getElementById('email').value,
            teacherName: document.getElementById('teacherName').value,
            date: document.getElementById('date').value,
            area: document.getElementById('areaSelect').value,
            school: document.getElementById('schoolSelect').value,
            groupName: document.getElementById('groupName').value,
            grade: document.getElementById('grade').value,
            classNum: document.getElementById('classNum').value,
            numStudents: document.getElementById('numStudents').value,
            studentAbility: document.getElementById('studentAbility').value,
            studentInterest: document.getElementById('studentInterest').value,
            messageEncouragement: document.getElementById('messageEncouragement').value,
            interacFeedback: document.getElementById('interacFeedback').value
        };

        fetch(SCRIPT_URL, {
            method: 'POST',
            mode: 'no-cors',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
        }).then(() => {
            document.getElementById('formContainer').style.display = 'none';
            document.getElementById('successMessage').style.display = 'block';
        }).catch(err => alert("Error submitting form: " + err));
    });
</script>
</body>
</html>
