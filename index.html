<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Assessment & Feedback Form</title>
  <style>
    :root {
      --primary-color: #2563eb;
      --bg-color: #f8fafc;
      --card-bg: #ffffff;
      --border-color: #cbd5e1;
      --text-color: #1e293b;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      margin: 0;
      padding: 20px;
    }

    .container {
      max-width: 800px;
      margin: 0 auto;
      background: var(--card-bg);
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
    }

    h1 {
      text-align: center;
      color: #0f172a;
      margin-bottom: 25px;
    }

    .form-group {
      margin-bottom: 20px;
    }

    label {
      display: block;
      font-weight: 600;
      margin-bottom: 8px;
    }

    select, input[type="text"], textarea {
      width: 100%;
      padding: 10px;
      border: 1px solid var(--border-color);
      border-radius: 6px;
      box-sizing: border-box;
      font-size: 14px;
    }

    .radio-group {
      display: flex;
      gap: 15px;
      flex-wrap: wrap;
      margin-top: 5px;
    }

    .radio-label {
      font-weight: normal;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .section-title {
      border-bottom: 2px solid var(--primary-color);
      padding-bottom: 5px;
      margin-top: 30px;
      margin-bottom: 20px;
      color: var(--primary-color);
    }

    button[type="submit"] {
      width: 100%;
      background-color: var(--primary-color);
      color: white;
      padding: 12px;
      border: none;
      border-radius: 6px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: background-color 0.2s;
    }

    button[type="submit"]:hover {
      background-color: #1d4ed8;
    }

    .note {
      font-size: 12px;
      color: #64748b;
      margin-top: 4px;
    }
  </style>
</head>
<body>

<div class="container">
  <h1>Student Assessment Form</h1>
  <form id="assessmentForm">

    <div class="form-group">
      <label for="citySelect">Select City / Region:</label>
      <select id="citySelect" onchange="updateFormFields()">
        <option value="kanzaki">Kanzaki City</option>
        <option value="chikusei">Chikusei City</option>
      </select>
    </div>

    <h2 class="section-title">School & Class Details</h2>

    <div class="form-group">
      <label for="schoolSelect">School Name:</label>
      <select id="schoolSelect"></select>
    </div>

    <div class="form-group">
      <label for="gradeSelect">Grade:</label>
      <select id="gradeSelect"></select>
    </div>

    <div class="form-group">
      <label for="classSelect">Class:</label>
      <select id="classSelect"></select>
    </div>

    <div class="form-group" id="identifierGroup">
      <label id="identifierLabel" for="identifierSelect">Group / Student Identifier:</label>
      <select id="identifierSelect"></select>
    </div>

    <h2 class="section-title">Performance Evaluation</h2>

    <div class="form-group">
      <label>Listening Skills:</label>
      <div class="radio-group">
        <label class="radio-label"><input type="radio" name="listening" value="3" required> 3 - Excellent</label>
        <label class="radio-label"><input type="radio" name="listening" value="2"> 2 - Good</label>
        <label class="radio-label"><input type="radio" name="listening" value="1"> 1 - Poor</label>
        <label class="radio-label"><input type="radio" name="listening" value="0"> 0 - Did not show up</label>
      </div>
    </div>

    <div class="form-group">
      <label>Speaking Skills:</label>
      <div class="radio-group">
        <label class="radio-label"><input type="radio" name="speaking" value="3" required> 3 - Excellent</label>
        <label class="radio-label"><input type="radio" name="speaking" value="2"> 2 - Good</label>
        <label class="radio-label"><input type="radio" name="speaking" value="1"> 1 - Poor</label>
        <label class="radio-label"><input type="radio" name="speaking" value="0"> 0 - Did not show up</label>
      </div>
    </div>

    <div class="form-group">
      <label>Proactiveness:</label>
      <div class="radio-group">
        <label class="radio-label"><input type="radio" name="proactiveness" value="3" required> 3 - Excellent</label>
        <label class="radio-label"><input type="radio" name="proactiveness" value="2"> 2 - Good</label>
        <label class="radio-label"><input type="radio" name="proactiveness" value="1"> 1 - Poor</label>
        <label class="radio-label"><input type="radio" name="proactiveness" value="0"> 0 - Did not show up</label>
      </div>
    </div>

    <div class="form-group">
      <label>Attitude:</label>
      <div class="radio-group">
        <label class="radio-label"><input type="radio" name="attitude" value="3" required> 3 - Excellent</label>
        <label class="radio-label"><input type="radio" name="attitude" value="2"> 2 - Good</label>
        <label class="radio-label"><input type="radio" name="attitude" value="1"> 1 - Poor</label>
        <label class="radio-label"><input type="radio" name="attitude" value="0"> 0 - Did not show up</label>
      </div>
    </div>

    <h2 class="section-title">Feedback</h2>

    <div class="form-group">
      <label for="studentFeedback">Encouragement / Feedback for Student(s):</label>
      <textarea id="studentFeedback" rows="4" placeholder="Write feedback here..."></textarea>
      <div class="note">*If your student did not show up, please leave them a positive comment about English.</div>
    </div>

    <div class="form-group">
      <label for="interacFeedback">Comments/Feedback for Interac about this lesson:</label>
      <textarea id="interacFeedback" rows="3" placeholder="Optional comments for Interac..."></textarea>
    </div>

    <button type="submit">Submit Assessment</button>
  </form>
</div>

<script>
  // City configurations and data models
  const formData = {
    kanzaki: {
      schools: ["Saigo ES", "Tobu ES", "Kanzaki ES", "Chubu ES", "Seibu ES", "Sefuri ES", "Niiyama ES"],
      grades: ["5th Grade", "6th Grade"],
      classes: ["Class 1", "Class 2", "Class 3"],
      identifierType: "Group Name",
      identifiers: Array.from({ length: 80 }, (_, i) => `Kanzaki City ${i + 1}`)
    },
    chikusei: {
      schools: ["Shimodate JHS", "Shimodate Nishi JHS", "Shimodate Minami JHS"],
      grades: ["1st Grade", "2nd Grade", "3rd Grade", "4th Grade", "5th Grade", "6th Grade", "7th Grade", "8th Grade", "9th Grade"],
      classes: ["Class 1", "Class 2", "Class 3", "Class 4", "Class 5", "Class 6", "Class 7", "Class 8", "Class 9"],
      identifierType: "Student ID Email",
      // Sample generated student accounts
      identifiers: Array.from({ length: 40 }, (_, i) => `CsShimodateJHS_1-1_${String(i + 1).padStart(2, '0')}@lit.co.jp`)
    }
  };

  function updateFormFields() {
    const city = document.getElementById("citySelect").value;
    const data = formData[city];

    // Populate Schools
    const schoolSelect = document.getElementById("schoolSelect");
    schoolSelect.innerHTML = data.schools.map(s => `<option value="${s}">${s}</option>`).join("");

    // Populate Grades
    const gradeSelect = document.getElementById("gradeSelect");
    gradeSelect.innerHTML = data.grades.map(g => `<option value="${g}">${g}</option>`).join("");

    // Populate Classes
    const classSelect = document.getElementById("classSelect");
    classSelect.innerHTML = data.classes.map(c => `<option value="${c}">${c}</option>`).join("");

    // Update Identifiers (Groups vs. Student Emails)
    document.getElementById("identifierLabel").innerText = data.identifierType + ":";
    const identifierSelect = document.getElementById("identifierSelect");
    identifierSelect.innerHTML = data.identifiers.map(id => `<option value="${id}">${id}</option>`).join("");
  }

  // Handle Form Submission
  document.getElementById("assessmentForm").addEventListener("submit", function(e) {
    e.preventDefault();
    alert("Form submitted successfully!");
  });

  // Initialize form on page load
  window.onload = updateFormFields;
</script>

</body>
</html>
