<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lesson Plan Form</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 20px;
    }
    .form-group {
      margin-bottom: 15px;
    }
    label {
      display: block;
      font-weight: bold;
      margin-bottom: 5px;
    }
    input[type="text"] {
      width: 250px;
      padding: 8px;
      border: 1px solid #ccc;
      border-radius: 4px;
    }
  </style>
</head>
<body>

  <h2>Lesson Information</h2>

  <form id="lessonForm">
    <div class="form-group">
      <label for="lessonDate">Lesson Date (YYYY-MM-DD):</label>
      <input type="text" id="lessonDate" name="lessonDate" placeholder="YYYY-MM-DD" maxlength="10">
    </div>

    <button type="submit">Submit</button>
  </form>

  <script>
    document.addEventListener("DOMContentLoaded", function () {
      const dateInput = document.getElementById('lessonDate');

      // 1. Awtomatikong ilagay ang petsa ngayon bilang default
      const today = new Date();
      const year = today.getFullYear();
      const month = String(today.getMonth() + 1).padStart(2, '0');
      const day = String(today.getDate()).padStart(2, '0');
      dateInput.value = `${year}-${month}-${day}`;

      // 2. Automatic formatting habang nagta-type ang user (YYYY-MM-DD)
      dateInput.addEventListener('input', function (e) {
        // Tanggalin ang lahat ng karakter na hindi numero
        let value = e.target.value.replace(/\D/g, '');

        // Maglagay ng dash (-) pagkatapos ng Year at Month
        if (value.length > 4 && value.length <= 6) {
          value = value.slice(0, 4) + '-' + value.slice(4);
        } else if (value.length > 6) {
          value = value.slice(0, 4) + '-' + value.slice(4, 6) + '-' + value.slice(6, 8);
        }

        e.target.value = value;
      });
    });
  </script>

</body>
</html>
