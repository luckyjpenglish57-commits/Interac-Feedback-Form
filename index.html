<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lesson Form</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
      background-color: #f9f9f9;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      width: 300px;
    }

    label {
      font-size: 14px;
      font-weight: bold;
      color: #1a2b4c; /* Dark blue shade katulad ng sa screenshot */
      margin-bottom: 6px;
    }

    label .required {
      color: #d9534f; /* Red asterisk */
    }

    .date-input {
      padding: 10px 12px;
      font-size: 14px;
      border: 1.5px solid #a85260; /* Dark pink / maroon border katulad ng sa screenshot */
      border-radius: 8px;
      outline: none;
      background-color: #fff;
      transition: border-color 0.2s ease-in-out;
    }

    .date-input:focus {
      border-color: #800020;
      box-shadow: 0 0 4px rgba(128, 0, 32, 0.2);
    }
  </style>
</head>
<body>

  <div class="form-group">
    <label for="lessonDate">
      Lesson Date <span class="required">*</span>
    </label>
    <input 
      type="text" 
      id="lessonDate" 
      name="lessonDate" 
      class="date-input" 
      placeholder="YYYY-MM-DD" 
      maxlength="10"
      required
    >
  </div>

  <script>
    document.addEventListener("DOMContentLoaded", function () {
      const dateInput = document.getElementById('lessonDate');

      // 1. Automatic: Kuhanin ang petsa ngayon at ilagay sa input field
      const today = new Date();
      const year = today.getFullYear();
      const month = String(today.getMonth() + 1).padStart(2, '0');
      const day = String(today.getDate()).padStart(2, '0');
      
      // Format: YYYY-MM-DD
      dateInput.value = `${year}-${month}-${day}`;

      // 2. Automatic Format sa pagta-type (kung babaguhin man ng user ang petsa)
      dateInput.addEventListener('input', function (e) {
        // Tanggalin ang anumang karakter na hindi numero
        let value = e.target.value.replace(/\D/g, '');

        // Kusa nitong lalagyan ng dash (-) sa YYYY-MM-DD format
        if (value.length > 4 && value.length <= 6) {
          value = value.slice(0, 4) + '-' + value.slice(4);
        } else if (value.length > 6) {
          value = value.slice(0, 4) + '-' + value.slice(4, 6) + '-' + value.slice(6, 8);
        }

        e.target.value = value;
      });
    });
  </script>

</body>
</html>
