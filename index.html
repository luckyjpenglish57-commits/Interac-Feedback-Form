<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lesson Form</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
      background-color: #f9f9f9;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      width: 320px;
      margin-bottom: 15px;
    }

    label {
      font-size: 14px;
      font-weight: bold;
      color: #1a2b4c;
      margin-bottom: 6px;
    }

    label .required {
      color: #d9534f;
    }

    label .note {
      font-weight: normal;
      color: #666;
      font-size: 0.85em;
      margin-left: 4px;
    }

    .custom-input {
      padding: 10px 12px;
      font-size: 14px;
      border: 1.5px solid #a85260;
      border-radius: 8px;
      outline: none;
      background-color: #fff;
    }

    .custom-input:focus {
      border-color: #800020;
      box-shadow: 0 0 4px rgba(128, 0, 32, 0.2);
    }

    .preview-box {
      margin-top: 15px;
      padding: 10px;
      background: #eef2f5;
      border-radius: 6px;
      font-size: 14px;
    }
  </style>
</head>
<body>

  <!-- DATE FIELD -->
  <div class="form-group">
    <label for="lessonDate">
      Date <span class="required">*</span> <span class="note">(Lesson Date)</span>
    </label>
    <input 
      type="text" 
      id="lessonDate" 
      name="lessonDate" 
      class="custom-input" 
      placeholder="YYYY-MM-DD" 
      maxlength="10"
      required
    >
  </div>

  <!-- GROUP NAME FIELD -->
  <div class="form-group">
    <label for="groupName">
      Group Name <span class="required">*</span>
    </label>
    <input 
      type="text" 
      id="groupName" 
      name="groupName" 
      class="custom-input" 
      placeholder="Enter group name..."
      required
    >
  </div>

  <!-- PREVIEW NG VALUES -->
  <div class="preview-box">
    <strong>Group Name Entered:</strong> <span id="displayGroupName">---</span>
  </div>

  <script>
    document.addEventListener("DOMContentLoaded", function () {
      // Elements
      const dateInput = document.getElementById('lessonDate');
      const groupInput = document.getElementById('groupName');
      const displayGroup = document.getElementById('displayGroupName');

      // 1. Auto-fill Date (Today)
      const today = new Date();
      const year = today.getFullYear();
      const month = String(today.getMonth() + 1).padStart(2, '0');
      const day = String(today.getDate()).padStart(2, '0');
      dateInput.value = `${year}-${month}-${day}`;

      // 2. Date Formatting (YYYY-MM-DD)
      dateInput.addEventListener('input', function (e) {
        let value = e.target.value.replace(/\D/g, '');
        if (value.length > 4 && value.length <= 6) {
          value = value.slice(0, 4) + '-' + value.slice(4);
        } else if (value.length > 6) {
          value = value.slice(0, 4) + '-' + value.slice(4, 6) + '-' + value.slice(6, 8);
        }
        e.target.value = value;
      });

      // 3. Group Name Output Handler
      groupInput.addEventListener('input', function () {
        displayGroup.textContent = groupInput.value || "---";
      });
    });
  </script>

</body>
</html>
